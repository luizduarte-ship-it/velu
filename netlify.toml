# Build: ofusca (minifica + embaralha) o JS inline do index.html e publica em dist/
# junto com _headers e robots.txt (ver build.js). Se o build falhar por qualquer
# motivo, cai no fallback que publica os arquivos crus (mantendo os headers de
# seguranca). CLAUDE.md e o resto do repo ficam de fora.
[build]
  command = "npm install --no-audit --no-fund && node build.js || (echo 'fallback sem ofuscacao' && mkdir -p dist && cp index.html dist/index.html && cp _headers dist/_headers && cp robots.txt dist/robots.txt)"
  publish = "dist"

# Consolida o www no dominio principal (evita certificado/host separado).
[[redirects]]
  from = "https://www.velucrm.com/*"
  to = "https://velucrm.com/:splat"
  status = 301
  force = true

# Seguranca: obriga o navegador a usar sempre HTTPS neste dominio e reduz
# avisos de "nao segura". So faz efeito apos a primeira visita por https.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
