# Build: ofusca (minifica + embaralha) o JS inline do index.html e publica em dist/
# junto com _headers e robots.txt (ver build.js). CLAUDE.md e o resto ficam de fora.
[build]
  command = "node build.js"
  publish = "dist"

# Consolida o www no dominio principal (evita certificado/host separado).
[[redirects]]
  from = "https://www.velucrm.com/*"
  to = "https://velucrm.com/:splat"
  status = 301
  force = true

# Seguranca: obriga o navegador a usar sempre HTTPS neste dominio e reduz
# avisos de "nao segura". So faz efeito apos a primeira visita por https.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
