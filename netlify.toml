# Build simples e confiavel (sem npm): copia index.html, _headers e robots.txt
# para dist/. Assim CLAUDE.md e o resto do repo nao vao para o ar.
# (A ofuscacao via build.js/terser foi desligada porque o npm install da Netlify
#  travava o deploy; da para reativar via CI depois. Ver build.js.)
[build]
  command = "mkdir -p dist && cp index.html dist/index.html && cp _headers dist/_headers && cp robots.txt dist/robots.txt && cp sitemap.xml dist/sitemap.xml && cp favicon.png dist/favicon.png && cp og.png dist/og.png"
  publish = "dist"

# Consolida o www no dominio principal (evita certificado/host separado).
[[redirects]]
  from = "https://www.velucrm.com/*"
  to = "https://velucrm.com/:splat"
  status = 301
  force = true

# Seguranca: obriga o navegador a usar sempre HTTPS neste dominio e reduz
# avisos de "nao segura". So faz efeito apos a primeira visita por https.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
